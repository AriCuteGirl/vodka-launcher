[package]
name = "vodka-launcher"
version = "0.4.0"
description = "A Roblox launcher for Linux, built on Mocktail"
authors = ["AriCuteGirl"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "vodka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros", "net"] }
keyring = "=4.2.0"
thiserror = "=2.0.21"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

# TLS differs by platform: rustls on Linux; Windows' own TLS (SChannel) on Windows, which needs no C toolchain to build.
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "gzip"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
